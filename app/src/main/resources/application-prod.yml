# Production: behind a TLS-terminating proxy or ingress.
server:
  # Trust X-Forwarded-* (so HTTPS is detected and HSTS sent). Only safe if the proxy is the only way in.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

logging:
  structured:
    format:
      # JSON lines (Elastic Common Schema), requestId included.
      console: ecs
