spring:
  application:
    name: kitchensink
  messages:
    # Without this, a browser asking for an unsupported language gets the server's locale, not English.
    fallback-to-system-locale: false
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/kitchensink}
  data:
    mongodb:
      # Indexes are Flamingock migrations (ADR 0005).
      auto-index-creation: false

flamingock:
  # Migrate before the web server opens its port. The default runs them after it's already open.
  management-mode: INITIALIZING_BEAN

server:
  # Not 8080: that's the legacy app, which the contract suite runs side by side.
  port: ${PORT:8081}
  shutdown: graceful
  servlet:
    session:
      # The UI's session holds the CSRF token and the "Registered!" flash message. Cookie only, never
      # in URLs (;jsessionid=...), where it leaks through logs and Referer headers.
      tracking-modes: cookie
      cookie:
        # Not JSESSIONID: browsers share cookies across ports, so on localhost this app's /-path cookie
        # was also sent to legacy on :8080, whose server then picked the wrong session (ViewExpiredException).
        name: KITCHENSINK_SESSION
        http-only: true
        same-site: lax

kitchensink:
  api:
    # Required (ADR 0007): empty values fail validation at startup.
    username: ${KITCHENSINK_API_USERNAME:}
    password: ${KITCHENSINK_API_PASSWORD:}

management:
  metrics:
    distribution:
      # Histogram buckets, so Prometheus can compute p95 across instances.
      percentiles-histogram:
        http.server.requests: true
  # Internal port, never exposed by the gateway. Only the probes are also on the public port.
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # /livez and /readyz on the public port.
        add-additional-paths: true
      group:
        # MongoDB counts for readiness only: restarting the app wouldn't fix the database.
        readiness:
          include: readinessState, mongo

logging:
  pattern:
    # RequestIdFilter's id on every log line of a request.
    correlation: "[%X{requestId:-}] "
