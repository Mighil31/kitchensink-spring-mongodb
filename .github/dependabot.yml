version: 2
updates:
  - package-ecosystem: maven
    directories: ["/", "/app", "/contract-tests", "/perf"]
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/app"
    schedule:
      interval: weekly
    # The brief targets Java 21: take patch/minor image updates, never a newer JDK line.
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: [">= 22"]
      - dependency-name: "maven"
        versions: ["> 3.9-eclipse-temurin-21"]
