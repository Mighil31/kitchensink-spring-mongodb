version: 2
updates:
  - package-ecosystem: maven
    directories: ["/", "/app", "/contract-tests", "/perf"]
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/app"
    schedule:
      interval: weekly
