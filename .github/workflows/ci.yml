name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on the runner).
      # The contract suite is opt-in (-Pcontract) and the perf project is separate, so neither runs here.
      - name: Build and test
        run: mvn -B verify
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/target/site/jacoco/
          if-no-files-found: ignore
