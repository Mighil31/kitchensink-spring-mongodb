name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on the runner).
      # The contract suite is opt-in (-Pcontract) and the perf project is separate, so neither runs here.
      - name: Build and test
        run: mvn -B verify
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/target/site/jacoco/
          if-no-files-found: ignore

  # Parity gate: the black-box HTTP suite that ran against legacy, run against the new app
  # (ADR 0008). The app runs as a plain jar on a fresh MongoDB, no dev profile, as in production.
  contract-v2:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the app
        run: mvn -B -pl app package -DskipTests
      # The API needs HTTP Basic (ADR 0007). The app only lives for this job, so a random password
      # made here is enough: no repository secret to manage. Masked so it never shows in the log.
      - name: API client password for this run
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "CONTRACT_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start the app and wait until ready
        env:
          MONGODB_URI: mongodb://localhost:27017/kitchensink
          KITCHENSINK_API_USERNAME: contract-client
          KITCHENSINK_API_PASSWORD: ${{ env.CONTRACT_PASSWORD }}
        run: |
          java -jar app/target/kitchensink-app-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health/readiness && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: API rejects requests without credentials
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/rest/members)
          echo "GET /rest/members without credentials: $status"
          test "$status" = 401
      - name: Contract suite against the new app
        run: >-
          mvn -B -pl contract-tests verify -Pcontract
          -Dcontract.format=v2 -Dcontract.baseUrl=http://localhost:8081/rest
          -Dcontract.user=contract-client
      - name: Contract reports and app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-v2
          path: |
            contract-tests/target/failsafe-reports/
            app.log
          if-no-files-found: ignore
