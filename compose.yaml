# Full local stack: MongoDB (with auth) + the app.
#   cp .env.example .env   # then set real passwords
#   docker compose up --build
# App: http://localhost:8081   Health: http://localhost:8081/actuator/health
services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_APP_DB: kitchensink
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./app
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/kitchensink?authSource=kitchensink
      # Local stack only: seeds John Smith (ADR 0005). Production runs without this profile.
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
