# Full local stack: MongoDB (with auth) + the app.
#   cp .env.example .env   # then set real passwords
#   docker compose up --build
# App: http://localhost:8081   Probes: /livez, /readyz   Metrics (internal port): http://localhost:9091/actuator/prometheus
services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_APP_DB: kitchensink
      MONGO_APP_USER: ${MONGO_APP_USER:?set in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./app
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/kitchensink?authSource=kitchensink
      KITCHENSINK_API_USERNAME: ${API_USER:?set in .env}
      KITCHENSINK_API_PASSWORD: ${API_PASSWORD:?set in .env}
      # Seeds John Smith. Production runs without it.
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:8081:8081"
      # Management port: published for local use only; in production only monitoring reaches it.
      - "127.0.0.1:9091:9091"
    depends_on:
      mongo:
        condition: service_healthy

  # Optional: docker compose --profile observability up   (Grafana: http://localhost:3000)
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      # Local only: read-only access without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kitchensink.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  mongo-data:
